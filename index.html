<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>História em Foco | Portal Futurista</title>
    <style>
        :root {
            --bg-color: #05050a;
            --text-color: #fff;
            --accent-color: #00f3ff;
            --panel-bg: rgba(10, 10, 25, 0.65);
        }

        .light-mode {
            --bg-color: #f0f2f5;
            --text-color: #333;
            --accent-color: #0066ff;
            --panel-bg: rgba(255, 255, 255, 0.8);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", sans-serif; }

        body, html { height: 100%; color: var(--text-color); background-color: var(--bg-color); transition: all 0.3s; }

        .hero-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, rgba(5, 5, 10, 0.8), rgba(15, 12, 41, 0.8));
            z-index: -1;
        }

        .main-container { display: flex; flex-direction: column; min-height: 100vh; padding: 25px 40px 50px 40px; overflow-y: auto; }

        /* Botão Tema */
        .theme-toggle { position: fixed; top: 20px; right: 20px; padding: 10px 15px; border-radius: 20px; cursor: pointer; background: var(--accent-color); color: #000; border: none; font-weight: bold; z-index: 100; }

        /* Pesquisa */
        .search-box { width: 100%; max-width: 650px; margin: 0 auto 20px; position: relative; }
        .search-box input { width: 100%; padding: 14px 20px 14px 50px; border-radius: 30px; border: 1px solid var(--accent-color); background: var(--panel-bg); color: var(--text-color); outline: none; }

        /* Seção de Cards */
        .categories-section { margin-bottom: 20px; }
        .section-title { font-size: 1.2rem; margin-bottom: 15px; font-weight: bold; color: var(--accent-color); }
        .cards-carousel { display: flex; gap: 18px; overflow-x: auto; padding: 10px 0; scroll-behavior: smooth; }
        
        .card { 
            flex: 0 0 180px; height: 210px; background: var(--panel-bg); border-radius: 12px; 
            overflow: hidden; border: 1px solid var(--accent-color); text-align: center; 
            display: flex; flex-direction: column; color: var(--text-color); position: relative;
        }
        
        .card img { width: 100%; height: 100px; object-fit: cover; cursor: pointer; transition: opacity 0.2s; }
        .card img:hover { opacity: 0.8; }
        
        .card-content { padding: 8px 5px; font-size: 0.85rem; font-weight: 600; flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .card-content a { color: var(--accent-color); text-decoration: none; font-size: 0.8rem; margin-top: 5px; }
        .card-content a:hover { text-decoration: underline; }

        /* Modal para abrir a foto no meio da tela */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.85); align-items: center; center; justify-content: center; flex-direction: column;
        }
        .modal img { max-width: 85%; max-height: 80vh; border-radius: 8px; border: 2px solid var(--accent-color); box-shadow: 0 0 20px rgba(0,243,255,0.4); }
        .modal-caption { color: #fff; margin-top: 15px; font-size: 1.1rem; font-weight: bold; text-align: center; }
        .close-modal { position: absolute; top: 20px; right: 30px; color: #fff; font-size: 40px; font-weight: bold; cursor: pointer; }
        .close-modal:hover { color: var(--accent-color); }

        /* Seção de Sugestões e Comentários */
        .feedback-section { margin-top: 30px; padding: 20px; background: var(--panel-bg); border-radius: 16px; border: 1px solid var(--accent-color); }
        .feedback-section h3 { margin-bottom: 15px; font-size: 1.1rem; text-align: center; }
        .feedback-wrapper { display: flex; gap: 10px; max-width: 600px; margin: 0 auto 20px auto; }
        .feedback-section input { flex: 1; padding: 10px 15px; border-radius: 20px; border: 1px solid var(--accent-color); background: transparent; color: var(--text-color); outline: none; }
        .feedback-section button { padding: 10px 20px; border-radius: 20px; background: var(--accent-color); color: #000; border: none; cursor: pointer; font-weight: bold; }

        /* Lista onde os comentários aparecem */
        .comments-list { max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; max-height: 200px; overflow-y: auto; }
        .comment-item { background: rgba(0, 243, 255, 0.1); border-left: 3px solid var(--accent-color); padding: 10px 15px; border-radius: 6px; font-size: 0.9rem; word-break: break-word; }

        @media (max-width: 768px) { .main-container { padding: 15px; } }
    </style>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()">Alternar Tema</button>
    <div class="hero-background"></div>

    <!-- Modal da Foto -->
    <div id="photoModal" class="modal" onclick="fecharModal()">
        <span class="close-modal">&times;</span>
        <img id="modalImg" src="" alt="Zoom da Imagem">
        <div id="modalCaption" class="modal-caption"></div>
    </div>

    <div class="main-container">
        <header class="top-bar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Pesquisar na História em Foco..." />
            </div>
        </header>

        <section class="categories-section">
            <div class="section-title">Prof. Marcelo Oliveira - Temas de História</div>
            <div class="cards-carousel" id="cardsContainer">
                <!-- Os cards aparecem aqui automaticamente via JavaScript -->
            </div>
        </section>

        <!-- Seção de Comentários / Sugestões -->
        <div class="feedback-section">
            <h3>Deixe sua sugestão ou comentário</h3>
            <div class="feedback-wrapper">
                <input type="text" id="feedbackInput" placeholder="Escreva aqui..." />
                <button onclick="adicionarComentario()">Enviar</button>
            </div>
            <!-- Container onde os comentários enviados vão aparecer -->
            <div class="comments-list" id="commentsList">
                <!-- Os comentários entram aqui dinamicamente -->
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        // Array para armazenar os comentários
         // Lista de comentários iniciais fictícios para preencher o mural
        let comentarios = [
            "Mariana Souza (Aluna): Professor, adorei o resumo sobre a Revolução Industrial! Me ajudou muito a estudar para a prova.",
            "Carlos Eduardo (Estudante): Muito top o site! Seria legal se tivesse algum conteúdo sobre a Roma Antiga também.",
            "Profª. Beatriz Lima (História): Parabéns pela iniciativa, Marcelo! Excelente forma de disponibilizar os materiais para os alunos.",
            "Lucas Gabriel (9º Ano): As imagens que abrem no meio da tela ficaram iradas demais! Facilitou muito a leitura.",
            "Camila Mendes (Aluna): O documento do Egito Antigo está perfeito. Professor, vai colocar quiz de perguntas em breve?",
            "João Vitor (Visitante): Conteúdo muito bem organizado. Nota 10 para o design futurista do portal!"
        ];

        function adicionarComentario() {
            const input = document.getElementById('feedbackInput');
            const textoComentario = input.value.trim();

            if(textoComentario !== "") {
                // Adiciona o novo comentário no início do array
                comentarios.unshift(textoComentario);
                input.value = "";
                renderizarComentarios();
            } else {
                alert("Por favor, escreva alguma coisa antes de enviar.");
            }
        }

        function renderizarComentarios() {
            const lista = document.getElementById('commentsList');
            lista.innerHTML = ""; // Limpa a lista atual

            comentarios.forEach(comentario => {
                const item = document.createElement('div');
                item.className = 'comment-item';
                item.textContent = comentario;
                lista.appendChild(item);
            });
        }

        // Funções para abrir e fechar a foto no meio da tela
        function abrirModal(imgSrc, imgTitle) {
            const modal = document.getElementById('photoModal');
            const modalImg = document.getElementById('modalImg');
            const modalCaption = document.getElementById('modalCaption');
            
            modal.style.display = "flex";
            modalImg.src = imgSrc;
            modalCaption.textContent = imgTitle;
        }

        function fecharModal() {
            document.getElementById('photoModal').style.display = "none";
        }

        // Lista de artigos
        const artigos = [
            {
                id: 0,
                category: "Pré-História",
                title: "O Período Paleolítico",
                period: "Pré-História",
                readTime: "6 min",
                image: "https://i.pinimg.com/736x/e0/1a/bd/e01abd4502c1723ce64f615b4d29af31.jpg",
                excerpt: "Conheça o período mais longo da humanidade...",
                url: "https://docs.google.com/document/d/10twRP8iNChhVP50zht4lRvotao9LCHzm/edit",
            },
            {
                id: 1,
                category: "Pré-História",
                title: "A Revolução Neolítica",
                period: "Pré-História",
                readTime: "7 min",
                image: "https://1.bp.blogspot.com/-eXprArqL2WI/YDvte-w6WqI/AAAAAAAAjic/995A8P3P2AcruwoaFjrb0NnRugX8uU-9QCLcBGAsYHQ/s728/2.jpg",
                excerpt: "Entenda como o domínio da agricultura...",
                url: "https://docs.google.com/document/d/19X7IbcTi4cRvBglwGalEh5YG6Nnuqadz/edit",
            },
            {
                id: 2,
                category: "Pré-História",
                title: "A Idade dos Metais",
                period: "Pré-História",
                readTime: "5 min",
                image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhdmVcin7vA1HTFwJhVgLDWZQVGMvqtqOSdmzwVrNAQnY4lKA2n5fDvRyzwwBrtBisTKaKv1wqtLl86rLZUNdPus2Z2Karms9PUyZu0NF944l-rVGpvZaL1oB6SDqdF9q2P3da3IHXFjkrkCPx2jRslJsvaVuF0EnfkE5YErgNUXXEWq60fPchdlXR8a60Z/s1536/Infografico%20sobre%20Idade%20dos%20Metais.png",
                excerpt: "A transição final com o domínio da fundição...",
                url: "https://docs.google.com/document/d/1KbK40WndDswKLORsI69wMZNtS44Cj29U/edit",
            },
            {
                id: 3,
                category: "Geral",
                title: "Fontes Históricas",
                period: "Introdução à História",
                readTime: "5 min",
                image: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjaQOsX6ndKWs5Nos0vcxZnxq8zQS8WTECfzSeZdcZMOw1JzbEwMnS_6l6Lf9Uiq2qI4pg0oeKlCqJUZA3YMa4IhWB03GaJhv0PdsO9lCuQ2Ao8x4uI8fUTdIJWz-G-4-_hZk98ZiU8QVmkj1j82P30-PP-xK2aUUHeBNqyp8dcKJ04SKsgP2SPbLWO/s2240/BannerHJ2023_21.jpg",
                excerpt: "Vestígios deixados pelos seres humanos...",
                url: "https://docs.google.com/document/d/1fXr7J6FghJaA_786xBnOt9tkwOfymk7H/edit",
            },
            {
                id: 4,
                category: "Geral",
                title: "Mesopotâmia e Egito Antigo",
                period: "Antiguidade Oriental",
                readTime: "6 min",
                image: "https://blog.explicae.com.br/wp-content/uploads/2022/08/1-5.png",
                excerpt: "O surgimento da escrita cuneiforme...",
                url: "https://docs.google.com/document/d/1Xsj0_VXTwAN9C92NR3IbOkSCgFAkXgAu/edit",
            },
            {
                id: 7,
                category: "Geral",
                title: "Idade Média: O Feudalismo",
                period: "Idade Média",
                readTime: "6 min",
                image: "https://images.unsplash.com/photo-1514539079130-25950c84af65?w=800&auto=format&fit=crop&q=80",
                excerpt: "A descentralização do poder e a sociedade estamental.",
                url: "https://docs.google.com/document/d/1fTDqhM7Xk9vYNnueupJvyEmCZib8ubk7/edit",
            },
            {
                id: 15,
                category: "Geral",
                title: "A Revolução Industrial",
                period: "Século XVIII - XIX",
                readTime: "6 min",
                image: "https://images.unsplash.com/photo-1516937941344-00b4e0337589?w=800&auto=format&fit=crop&q=80",
                excerpt: "A transição para a produção mecânica.",
                url: "https://docs.google.com/document/d/1SmPi9WrGdhktO40zmwPVHmYIFwlxv_9S/edit",
            },
            {
                id: 31,
                category: "Geral",
                title: "Segunda Guerra Mundial",
                period: "Idade Contemporânea (1939-1945)",
                readTime: "8 min",
                image: "https://1.bp.blogspot.com/--HwaIUOQPDQ/X2DakNtiuhI/AAAAAAAAG1s/IUTRvV-YkOsDtTp9oYraVUB4w503VzwpACLcBGAsYHQ/s2048/POST_Fascismo-e-Nazismo.png",
                excerpt: "As causas do conflito e o Holocausto.",
                url: "https://docs.google.com/document/d/1slFONVa1ARl4AkbikxxoyH_epPhWtCY8/edit",
            }
        ];

        // Montagem dinâmica dos cards
        const cardsContainer = document.getElementById('cardsContainer');
        
        artigos.forEach(artigo => {
            const card = document.createElement('div');
            card.className = 'card';
            
            card.innerHTML = `
                <img src="${artigo.image}" alt="${artigo.title}" onclick="abrirModal('${artigo.image}', '${artigo.title}')">
                <div class="card-content">
                    <p>${artigo.title}</p>
                    <a href="${artigo.url !== "#" ? artigo.url : "javascript:void(0);"}" target="_blank">Acessar Docs</a>
                </div>
            `;
            cardsContainer.appendChild(card);
        });
    </script>
</body>
</html>
